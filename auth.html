<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Bypass Checklist - eWPT</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a0d0d; color: #e0e0e0; margin: 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff4444; padding-bottom: 10px; }
        h2 { color: #ff4444; margin: 0; }
        table { width: 100%; border-collapse: collapse; background-color: #261616; margin-top: 20px; table-layout: fixed; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; word-wrap: break-word; }
        th { background-color: #331a1a; color: #ff4444; position: sticky; top: 0; }
        tr:hover { background-color: #3d1f1f; }
        .payload-code { font-family: 'Courier New', monospace; color: #ff8a8a; background: #1a0d0d; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; display: block; }
        button { background-color: #ff4444; color: #fff; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; min-width: 80px; }
        .reset-btn { background-color: #ffffff; color: black; }
        input[type="text"] { width: 95%; background: #331a1a; border: 1px solid #555; color: #fff; padding: 6px; }
        .checkbox-col { text-align: center; width: 50px; }
    </style>
</head>
<body>
    <div class="header-container">
        <h2>🔐 Auth Bypass Checklist</h2>
        <button class="reset-btn" onclick="resetForm()">Clear All</button>
    </div>
    <p>Live tool for eWPT. Focuses on logic and header manipulation.</p>
    <table id="payloadTable">
        <thead>
            <tr>
                <th style="width: 30px;">#</th>
                <th style="width: 35%;">Payload/Header</th>
                <th style="width: 25%;">Description</th>
                <th style="width: 100px;">Action</th>
                <th class="checkbox-col">Done</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <script>
        const payloads = [
            { id: 1, p: 'admin', d: 'Username: Common admin guess' },
            { id: 2, p: 'X-Forwarded-For: 127.0.0.1', d: 'Header: Spoof local origin' },
            { id: 3, p: 'X-Remote-IP: 127.0.0.1', d: 'Header: Spoof internal IP' },
            { id: 4, p: 'admin=true', d: 'Cookie/Param: Simple privilege escal.' },
            { id: 5, p: 'role=admin', d: 'Cookie/Param: Role manipulation' },
            { id: 6, p: '%00', d: 'Null Byte: End of string testing' },
            { id: 7, p: '{"user":"admin","admin":true}', d: 'JSON: Admin flag injection' },
            { id: 8, p: 'user=admin&user=test', d: 'HPP: HTTP Parameter Pollution' },
            { id: 9, p: '/admin/.', d: 'Path: . bypass for directory restriction' },
            { id: 10, p: '/SECRET_URL/..;/admin', d: 'Tomcat/Nginx semicolon bypass' }
        ];

        const tableBody = document.getElementById('tableBody');
        payloads.forEach(item => {
            const b64 = btoa(item.p);
            const row = document.createElement('tr');
            row.innerHTML = `<td>${item.id}</td><td><span class="payload-code">${item.p}</span></td><td>${item.d}</td><td><button onclick="copyEncoded('${b64}')">Copy</button></td><td class="checkbox-col"><input type="checkbox" class="task-check"></td><td><input type="text" class="task-note"></td>`;
            tableBody.appendChild(row);
        });

        function copyEncoded(b64Data) {
            navigator.clipboard.writeText(atob(b64Data));
            const btn = event.target; btn.innerText = 'Copied!'; setTimeout(() => { btn.innerText = 'Copy'; }, 800);
        }

        function resetForm() { if(confirm("Clear progress?")) { document.querySelectorAll('.task-check').forEach(cb => cb.checked = false); document.querySelectorAll('.task-note').forEach(nt => nt.value = ''); } }
    </script>
</body>
</html>
